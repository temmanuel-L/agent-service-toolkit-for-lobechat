version: "3.3"

services:
  postgres:
    container_name: postgres-${APP_NAME}-${TAG}
    image: postgres:16
    env_file:
      - .env
    ports:
      # - "${POSTGRES_PORT:-5433}:5432"
      - "5433:5432"
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-127.0.0.1}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    container_name: qdrant-${APP_NAME}-${TAG}
    image: qdrant/qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
    volumes:
      - qdrant_data:/qdrant/storage
    # healthcheck:
    #   test: ["CMD", "nc", "-z", "localhost", "6333"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s

  agent_service:
    container_name: agent_service-${APP_NAME}-${TAG}
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      # qdrant:
        # condition: service_healthy
    healthcheck:
      # test: ["CMD", "python", "-c", "import requests; r = requests.get('http://localhost:8080/info'); exit(0 if r.status_code == 200 else 1)"]
      test: [ "CMD", "curl", "-f", "http://localhost:${PORT:-8080}/info" ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s  # 给服务足够时间启动
    environment:
      - QDRANT_URL=http://qdrant:${QDRANT_PORT:-6333}
    volumes:
      - log:/log/
      - ./src:/app/src
    develop:
      watch:
        - path: src/agents/
          action: sync+restart
          target: /app/agents/
        - path: src/schema/
          action: sync+restart
          target: /app/schema/
        - path: src/service/
          action: sync+restart
          target: /app/service/
        - path: src/core/
          action: sync+restart
          target: /app/core/
        - path: src/memory/
          action: sync+restart
          target: /app/memory/

  # =========================================
  # Langfuse V3 Infrastructure
  # =========================================

  langfuse-clickhouse:
    container_name: langfuse-clickhouse-${APP_NAME}-${TAG}
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      - CLICKHOUSE_DB=langfuse
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-langfuse}
    ports:
        - "8123:8123"
        - "9023:9000" # Mapped to 9023 to avoid conflict with Lobe MinIO (9000)
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-redis:
    container_name: langfuse-redis-${APP_NAME}-${TAG}
    image: redis:7
    restart: unless-stopped
    command: >
      sh -c "redis-server --requirepass ${REDIS_AUTH:-langfuse-redis} --save 60 1 --loglevel warning"
    ports:
      - "6378:6379" # Mapped to 6378 to avoid conflict with Lobe Redis (6379)
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 5s
        retries: 10

  langfuse-minio:
    container_name: langfuse-minio-${APP_NAME}-${TAG}
    image: minio/minio:latest
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=miniosecret
    ports:
      - "9092:9000" # API: Mapped to 9092 to avoid conflict with Lobe MinIO (9000)
      - "9093:9001" # UI: Mapped to 9093 to avoid conflict with Lobe MinIO (9001)
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 10s
      retries: 10

  langfuse-worker:
    container_name: langfuse-worker-${APP_NAME}-${TAG}
    image: langfuse/langfuse-worker:3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse: 
        condition: service_healthy # Clickhouse healthcheck is HTTP, might be ready before TCP, but good enough
    env_file:
      - .env
    ports:
      - "3030:3030" # Optional: Worker health/metric port
    environment:
      - PORT=3030
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3001
    
  langfuse-web:
    container_name: langfuse-web-${APP_NAME}-${TAG}
    image: langfuse/langfuse:3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3001:3000" # Mapped to 3001, Internal port overridden to 3000 below
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3001
      # Automatically initialize the project with keys from .env
      - LANGFUSE_INIT_ORG_ID=default_org
      - LANGFUSE_INIT_ORG_NAME=Default Org
      - LANGFUSE_INIT_PROJECT_ID=default_project
      - LANGFUSE_INIT_PROJECT_NAME=Default Project
      - LANGFUSE_INIT_USER_EMAIL=admin@admin.com
      - LANGFUSE_INIT_USER_NAME=Admin
      - LANGFUSE_INIT_USER_PASSWORD=password
      - LANGFUSE_INIT_PROJECT_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_INIT_PROJECT_SECRET_KEY=${LANGFUSE_SECRET_KEY}

volumes:
  postgres_data:
  qdrant_data:
  log:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_redis_data:
  langfuse_minio_data: